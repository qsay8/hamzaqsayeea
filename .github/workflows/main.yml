name: Windows 11 ARM64 + Tailscale + Download.bat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 350

    steps:
      - name: Check Windows architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Restrict RDP to Tailscale IPv4 addresses.
          Get-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

      - name: Create RDP user with fixed password
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name $username `
              -Password $securePass `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name $username -Password $securePass
          }

          Enable-LocalUser -Name $username

          foreach ($group in @("Remote Desktop Users")) {
            $members = Get-LocalGroupMember -Group $group

            if (-not ($members | Where-Object {
              $_.Name -match "\\RDP$"
            })) {
              Add-LocalGroupMember -Group $group -Member $username
            }
          }

          Write-Host "RDP account configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Tailscale Windows ARM64 compatibility:
          # Use the x86 MSI for ARM64 Windows.
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-x86.msi"
          $installer = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList @(
              "/i", "`"$installer`"",
              "/quiet", "/norestart"
            ) -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          $candidates = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tailscale = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $tailscale) {
            throw "Could not locate tailscale.exe."
          }

          $tailscale | Set-Content "$env:RUNNER_TEMP\tailscale-path.txt"

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "Configure the TAILSCALE_AUTHKEY repository secret."
          }

          $tailscale = Get-Content "$env:RUNNER_TEMP\tailscale-path.txt"
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $result = & $tailscale ip -4 2>$null
            $candidate = ($result | Select-Object -First 1).Trim()

            if ($candidate -match '^100\.') {
              $tsIP = $candidate
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" | Add-Content $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP listener
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $listener = Get-NetTCPConnection `
            -State Listen `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP is not listening on port 3389."
          }

          Write-Host "RDP listener is active."
          Write-Host "Tailscale address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"

      - name: Download and execute Downloads.bat
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $profile = "C:\Users\RDP"
          $startup = Join-Path $profile `
            "AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $url = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $download = Join-Path $startup "Downloads.bat"

          # Wait for the profile directory to exist.
          # Creating the local account alone does not create its profile.
          while (-not (Test-Path $profile)) {
            Write-Host "Waiting for the RDP profile..."
            Start-Sleep -Seconds 15
          }

          New-Item -ItemType Directory -Path $startup -Force |
            Out-Null

          Invoke-WebRequest -Uri $url -OutFile $download

          if (-not (Test-Path $download) -or
              (Get-Item $download).Length -eq 0) {
            throw "Downloads.bat download failed or returned an empty file."
          }

          Write-Host "Downloaded Downloads.bat."

          # Review the downloaded batch file before running it.
          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList "/c `"$download`"" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Downloads.bat failed with exit code $($process.ExitCode)."
          }

          Write-Host "Downloads.bat finished."

      - name: Maintain runner
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "Runner active: $(Get-Date -Format o)"
            Start-Sleep -Seconds 300
          }
